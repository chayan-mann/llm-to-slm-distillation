[project]
name = "ticket-router"
version = "0.1.0"
description = "Distill a big-model ticket router into a small model."
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
